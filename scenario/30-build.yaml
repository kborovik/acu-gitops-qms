scenario: build
description: Assemble ImmunoShield and CardioPure kits from released raw materials
steps:
- id: asm-immune
  put: KitAssembly
  record:
    Type: Production
    KitInventoryID: FG-IMMUNE-DEFENSE-60C
    Revision: V1
    Qty: 100
    WarehouseID: WH-MISS-01
    LocationID: MAIN
    ReasonCode: INASSEMBLY
    Hold: false
  capture: {ReferenceNbr: asm_immune}
- id: lines-immune
  get:
    entity: KitAssembly
    keys: [Production, "${asm_immune}"]
    expand: [StockComponents]
  capture:
    StockComponents[0].id: immune_ech_id
    StockComponents[0].LineNbr: immune_ech_line
    StockComponents[1].id: immune_eld_id
    StockComponents[1].LineNbr: immune_eld_line
    StockComponents[2].id: immune_ash_id
    StockComponents[2].LineNbr: immune_ash_line
- id: alloc-immune
  put: KitAssembly
  record:
    Type: Production
    ReferenceNbr: "${asm_immune}"
    StockComponents:
    - id: "${immune_ech_id}"
      LineNbr: "${immune_ech_line}"
      StockInventoryID: RAW-ECH-EXT4
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${immune_ech_line}", LocationID: MAIN, LotSerialNbr: NB-ECH-25001, Qty: 1.2}
    - id: "${immune_eld_id}"
      LineNbr: "${immune_eld_line}"
      StockInventoryID: RAW-ELD-EXT10
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${immune_eld_line}", LocationID: MAIN, LotSerialNbr: NB-ELD-25001, Qty: 0.9}
    - id: "${immune_ash_id}"
      LineNbr: "${immune_ash_line}"
      StockInventoryID: RAW-ASH-EXT5
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${immune_ash_line}", LocationID: MAIN, LotSerialNbr: AB-ASH-25001, Qty: 0.6}
- id: release-asm-immune
  action: {entity: KitAssembly, name: ReleaseKitAssembly}
  record: {Type: Production, ReferenceNbr: "${asm_immune}"}
  wait:
    entity: KitAssembly
    keys: [Production, "${asm_immune}"]
    until: {Status: Released}
- id: asm-cardio
  put: KitAssembly
  record:
    Type: Production
    KitInventoryID: FG-CARDIO-OMEGA-COQ10-60SG
    Revision: V1
    Qty: 50
    WarehouseID: WH-MISS-01
    LocationID: MAIN
    ReasonCode: INASSEMBLY
    Hold: false
  capture: {ReferenceNbr: asm_cardio}
- id: lines-cardio
  get:
    entity: KitAssembly
    keys: [Production, "${asm_cardio}"]
    expand: [StockComponents]
  capture:
    StockComponents[0].id: cardio_om3_id
    StockComponents[0].LineNbr: cardio_om3_line
    StockComponents[1].id: cardio_coq_id
    StockComponents[1].LineNbr: cardio_coq_line
    StockComponents[2].id: cardio_ast_id
    StockComponents[2].LineNbr: cardio_ast_line
- id: alloc-cardio
  put: KitAssembly
  record:
    Type: Production
    ReferenceNbr: "${asm_cardio}"
    StockComponents:
    - id: "${cardio_om3_id}"
      LineNbr: "${cardio_om3_line}"
      StockInventoryID: RAW-OMEGA3-70
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${cardio_om3_line}", LocationID: MAIN, LotSerialNbr: NM-OM3-25001, Qty: 3.0}
    - id: "${cardio_coq_id}"
      LineNbr: "${cardio_coq_line}"
      StockInventoryID: RAW-COQ10-99
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${cardio_coq_line}", LocationID: MAIN, LotSerialNbr: NP-COQ-25001, Qty: 0.3}
    - id: "${cardio_ast_id}"
      LineNbr: "${cardio_ast_line}"
      StockInventoryID: RAW-ASTA-10
      LocationID: MAIN
      Allocations:
      - {LineNbr: "${cardio_ast_line}", LocationID: MAIN, LotSerialNbr: NM-AST-25001, Qty: 0.05}
- id: release-asm-cardio
  action: {entity: KitAssembly, name: ReleaseKitAssembly}
  record: {Type: Production, ReferenceNbr: "${asm_cardio}"}
  wait:
    entity: KitAssembly
    keys: [Production, "${asm_cardio}"]
    until: {Status: Released}
expect:
- get:
    entity: KitAssembly
    keys: [Production, "${asm_immune}"]
  fields:
    Status: Released
- get:
    entity: KitAssembly
    keys: [Production, "${asm_cardio}"]
  fields:
    Status: Released
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: FG-IMMUNE-DEFENSE-60C, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: 100.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: FG-CARDIO-OMEGA-COQ10-60SG, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: 50.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-ECH-EXT4, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -1.2}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-ELD-EXT10, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -0.9}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-ASH-EXT5, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -0.6}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-OMEGA3-70, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -3.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-COQ10-99, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -0.3}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: RAW-ASTA-10, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -0.05}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '10100'}
  delta: {EndingBalance: 0.00}
