expect:
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_vitalplus}"]
  fields:
    Status: Closed
- get:
    entity: Payment
    keys: [Payment, "${pmt_vitalplus}"]
  fields:
    Status: Closed
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_heartlab}"]
  fields:
    Status: Closed
- get:
    entity: Payment
    keys: [Payment, "${pmt_heartlab}"]
  fields:
    Status: Closed
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_wellcan}"]
  fields:
    Status: Closed
- get:
    entity: Payment
    keys: [Payment, "${pmt_wellcan}"]
  fields:
    Status: Closed
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: FG-IMMUNE-DEFENSE-60C, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -60.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: FG-CARDIO-OMEGA-COQ10-60SG, WarehouseID: WH-MISS-01}
  delta: {QtyOnHand: -25.0}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '40000'}
  delta: {EndingBalance: 2340.00}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '50000'}
  delta: {EndingBalance: 433.80}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '11000'}
  delta: {EndingBalance: 0.00}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '10100'}
  delta: {EndingBalance: 2340.00}
