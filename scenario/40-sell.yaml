scenario: sell
description: Sell pack (SO ship invoice collect) for VITALPLUS HEARTLAB WELLCAN
steps:
- id: so-vitalplus
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: VITALPLUS
    Hold: false
    Details:
    - {InventoryID: FG-IMMUNE-DEFENSE-60C, OrderQty: 40, WarehouseID: WH-MISS-01}
  capture: {OrderNbr: so_vitalplus}
- id: ship-vitalplus
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_vitalplus}"}
  parameters: {WarehouseID: WH-MISS-01}
- id: shipnbr-vitalplus
  get:
    entity: SalesOrder
    keys: [SO, "${so_vitalplus}"]
    expand: [Shipments]
  capture:
    Shipments[0].ShipmentNbr: ship_vitalplus
- id: confirm-vitalplus
  action: {entity: Shipment, name: ConfirmShipment}
  record: {ShipmentNbr: "${ship_vitalplus}"}
  wait:
    entity: Shipment
    keys: ["${ship_vitalplus}"]
    until: {Status: Confirmed}
- id: prepare-vitalplus
  action: {entity: Shipment, name: PrepareInvoice}
  record: {ShipmentNbr: "${ship_vitalplus}"}
- id: invnbr-vitalplus
  get:
    entity: SalesOrder
    keys: [SO, "${so_vitalplus}"]
    expand: [Shipments]
  capture:
    Shipments[0].InvoiceNbr: inv_vitalplus
- id: release-inv-vitalplus
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${inv_vitalplus}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_vitalplus}"]
    until: {Status: Open}
- id: pay-vitalplus
  put: Payment
  record:
    Type: Payment
    CustomerID: VITALPLUS
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 960.00
    PaymentRef: "WIRE-${inv_vitalplus}"
    Hold: false
    DocumentsToApply:
    - {DocType: Invoice, ReferenceNbr: "${inv_vitalplus}", AmountPaid: 960.00}
  capture: {ReferenceNbr: pmt_vitalplus}
- id: release-pay-vitalplus
  action: {entity: Payment, name: ReleasePayment}
  record: {Type: Payment, ReferenceNbr: "${pmt_vitalplus}"}
  wait:
    entity: Payment
    keys: [Payment, "${pmt_vitalplus}"]
    until: {Status: Closed}
- id: so-heartlab
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: HEARTLAB
    Hold: false
    Details:
    - {InventoryID: FG-CARDIO-OMEGA-COQ10-60SG, OrderQty: 25, WarehouseID: WH-MISS-01}
  capture: {OrderNbr: so_heartlab}
- id: ship-heartlab
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_heartlab}"}
  parameters: {WarehouseID: WH-MISS-01}
- id: shipnbr-heartlab
  get:
    entity: SalesOrder
    keys: [SO, "${so_heartlab}"]
    expand: [Shipments]
  capture:
    Shipments[0].ShipmentNbr: ship_heartlab
- id: confirm-heartlab
  action: {entity: Shipment, name: ConfirmShipment}
  record: {ShipmentNbr: "${ship_heartlab}"}
  wait:
    entity: Shipment
    keys: ["${ship_heartlab}"]
    until: {Status: Confirmed}
- id: prepare-heartlab
  action: {entity: Shipment, name: PrepareInvoice}
  record: {ShipmentNbr: "${ship_heartlab}"}
- id: invnbr-heartlab
  get:
    entity: SalesOrder
    keys: [SO, "${so_heartlab}"]
    expand: [Shipments]
  capture:
    Shipments[0].InvoiceNbr: inv_heartlab
- id: release-inv-heartlab
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${inv_heartlab}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_heartlab}"]
    until: {Status: Open}
- id: pay-heartlab
  put: Payment
  record:
    Type: Payment
    CustomerID: HEARTLAB
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 900.00
    PaymentRef: "WIRE-${inv_heartlab}"
    Hold: false
    DocumentsToApply:
    - {DocType: Invoice, ReferenceNbr: "${inv_heartlab}", AmountPaid: 900.00}
  capture: {ReferenceNbr: pmt_heartlab}
- id: release-pay-heartlab
  action: {entity: Payment, name: ReleasePayment}
  record: {Type: Payment, ReferenceNbr: "${pmt_heartlab}"}
  wait:
    entity: Payment
    keys: [Payment, "${pmt_heartlab}"]
    until: {Status: Closed}
- id: so-wellcan
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: WELLCAN
    Hold: false
    Details:
    - {InventoryID: FG-IMMUNE-DEFENSE-60C, OrderQty: 20, WarehouseID: WH-MISS-01}
  capture: {OrderNbr: so_wellcan}
- id: ship-wellcan
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_wellcan}"}
