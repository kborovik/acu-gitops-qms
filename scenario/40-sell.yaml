  record: {Type: Invoice, ReferenceNbr: "${inv_wellcan}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_wellcan}"]
    until: {Status: Open}
- id: pay-wellcan
  put: Payment
  record:
    Type: Payment
    CustomerID: WELLCAN
    PaymentMethod: WIRE
    CashAccount: '10100'
    PaymentAmount: 480.00
    PaymentRef: "WIRE-${inv_wellcan}"
    Hold: false
    DocumentsToApply:
